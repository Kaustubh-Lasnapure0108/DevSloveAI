<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Code & Error Explainer</title>
  <!-- Tailwind CSS for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center p-6">

  <!-- Header -->
  <header class="text-center my-6">
    <h1 class="text-4xl font-bold text-blue-500 mb-2">⚡ AI Code & Error Explainer</h1>
    <p class="text-slate-400">Paste your code or error message to get instant AI-powered explanations and fixes.</p>
  </header>

  <!-- Main Container -->
  <main class="w-full max-w-3xl bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
    
    <!-- API Key Input -->
    <div class="mb-4">
      <label class="block text-sm font-medium mb-1 text-slate-300">Google Gemini API Key:</label>
      <input type="password" id="apiKey" placeholder="Enter your Gemini API key here" 
             class="w-full p-3 rounded-lg bg-slate-900 border border-slate-700 focus:outline-none focus:border-blue-500 text-sm">
    </div>

    <!-- Code Input Area -->
    <div class="mb-4">
      <label class="block text-sm font-medium mb-1 text-slate-300">Paste your code or error here:</label>
      <textarea id="codeInput" rows="6" placeholder="Paste your code snippet or error message here..." 
                class="w-full p-3 rounded-lg bg-slate-900 border border-slate-700 focus:outline-none focus:border-blue-500 font-mono text-sm"></textarea>
    </div>

    <!-- Submit Button -->
    <button id="analyzeBtn" onclick="analyzeCode()" 
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-200">
      🔍 Analyze Code with AI
    </button>

    <!-- Loading Indicator -->
    <div id="loading" class="hidden text-center my-4 text-blue-400 font-medium">
      ⏳ Analyzing your code with AI, please wait...
    </div>

    <!-- Output Box -->
    <div id="outputContainer" class="mt-6 hidden">
      <h2 class="text-xl font-semibold text-green-400 mb-2">📊 AI Analysis & Solution:</h2>
      <div id="output" class="p-4 bg-slate-900 rounded-lg border border-slate-700 whitespace-pre-wrap font-sans text-slate-200 leading-relaxed"></div>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
